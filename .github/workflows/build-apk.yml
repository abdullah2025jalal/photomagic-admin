name: Build Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Inject Firebase Config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ vars.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "ERROR: repository variable GOOGLE_SERVICES_JSON_B64 is not set." >&2
            echo "The APK would be built without Firebase and the accounts panel would fail." >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          echo "Injected android/app/google-services.json"
          grep -o '"package_name"[^,]*' android/app/google-services.json | head -n 3

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/PhotoMagic-Admin-Release.apk
            echo "APK generated successfully at build-output/PhotoMagic-Admin-Release.apk"
          else
            echo "Release APK not found, checking debug APK fallback..."
            flutter build apk --debug
            cp $(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1) build-output/PhotoMagic-Admin-Debug.apk
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMagic-Admin-Release-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
